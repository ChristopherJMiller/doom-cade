[workspace]
resolver = "2"
members = [
  "crates/protocol",
  "crates/supervisor",
  "crates/attract",
  "crates/leaderboard",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
protocol = { path = "crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "process",
  "fs",
  "io-util",
  "time",
  "sync",
  "signal",
  "net",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }
# rusqlite (supervisor spool) and sqlx (leaderboard) both link the native
# sqlite3 via libsqlite3-sys — their versions must resolve to the same
# libsqlite3-sys or the workspace build fails on the `links` conflict.
rusqlite = { version = "0.32", features = ["bundled"] }
axum = "0.8"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "migrate",
] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
eframe = { version = "0.31", default-features = false, features = [
  "glow",
  "wayland",
  "x11",
  "default_fonts",
] }
egui = "0.31"
ureq = { version = "2", features = ["json"] }
libc = "0.2"
nix = { version = "0.29", features = ["signal", "fs"] }
