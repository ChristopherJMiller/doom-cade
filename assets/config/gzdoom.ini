# gzdoom.ini — pristine per-run GZDoom config template (SPEC §8.2, §10).
#
# The supervisor copies this file fresh into tmpfs
# (/run/doom-arcade/session/gzdoom.ini) before EVERY run, so no player ever
# inherits another player's rebinds, resolution changes, autosaves, or
# console state. Never point gzdoom at a long-lived writable copy.
#
# VERIFY ON HARDWARE (SPEC §13.5): cheap USB encoders vary in their factory
# key map. Capture the actual scancodes with `evtest` on the real cabinet
# and adjust [Doom.Bindings] to match — do not trust the datasheet.
#
# FLAGGED — values below not fully verified against the pinned GZDoom's
# docs; confirm against the GZDoom version pinned in flake.nix:
#   * Esc/menu: GZDoom's Esc-opens-menu behavior is engine-hardcoded, not a
#     key binding, so there is no real Esc binding to remove. The blank
#     "escape=" line below is belt-and-braces only; the actual protection is
#     that the arcade panel has no Esc key. Confirm on the cabinet that the
#     menu is unreachable from the encoder (SPEC §9, §10).
#   * disableautosave: value semantics assumed 0=allow all, 1=scripted
#     only, 2=never. We use 2 (never), plus autosavecount=0 as a backstop.
#   * m_use_mouse: assumed 0 disables mouse use in menus; use_mouse=false
#     is the primary mouse kill switch.
#   * Section placement: GZDoom applies cvars found in either
#     [GlobalSettings] or [Doom.ConsoleVariables]; everything here sits in
#     [GlobalSettings]. If a value does not stick on the pinned build, move
#     it to [Doom.ConsoleVariables].

[GlobalSettings]
# Kiosk presentation: fullscreen, never show the IWAD picker dialog.
vid_fullscreen=true
queryiwad=false
# No FPS counter on an arcade cabinet.
vid_fps=false
# Run is always on — no button is spent on it (SPEC §10).
cl_run=true
# Saving/loading is not part of an arcade run: no confirmation dialogs to
# get stuck on, and no autosaves accumulating in tmpfs.
saveloadconfirmation=false
disableautosave=2
autosavecount=0
# Volume cap so the cabinet cannot become a nuisance (SPEC §9).
snd_mastervolume=0.7
# A cabinet has no mouse: kill mouse input entirely, including in menus.
use_mouse=false
m_use_mouse=0

# Providing the bindings sections replaces GZDoom's defaults wholesale
# (present section => UnbindAll, then only these keys). Everything not
# listed — console toggle, chat, automap, screenshots, quicksave — is
# therefore unbound.
[Doom.Bindings]
# Joystick (encoder in keyboard mode): arrows = move/turn (SPEC §10).
uparrow=+forward
downarrow=+back
leftarrow=+left
rightarrow=+right
# Button 1: fire — both Ctrl keys, encoders differ on which they send.
ctrl=+attack
rctrl=+attack
# Button 2: use / open.
space=+use
# Buttons 3/4: strafe.
,=+moveleft
.=+moveright
# Buttons 5/6: weapon prev/next. GZDoom's config-safe names for [ and ].
leftbracket=weapprev
rightbracket=weapnext
# Belt-and-braces: keep Esc bound to nothing (see FLAGGED note above).
escape=

# Present-but-empty: wipes GZDoom's default double-tap and automap
# bindings instead of letting the engine install them.
[Doom.DoubleBindings]

[Doom.AutomapBindings]
